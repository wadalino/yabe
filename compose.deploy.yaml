services:
  app:
    image: yabe:latest
    ports:
      - "8000:8000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database/database.sqlite
    volumes:
      - yabe-database:/app/storage/database
    restart: unless-stopped

volumes:
  yabe-database:
